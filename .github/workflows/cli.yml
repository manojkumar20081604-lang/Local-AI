name: CLI Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: local-ai-linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: local-ai-darwin-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: local-ai-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: local-ai-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-provider: buildjet

      - name: Build CLI
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact (unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cli/target/${{ matrix.target }}/release/local-ai
          if-no-files-found: error

      - name: Upload artifact (windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cli/target/${{ matrix.target }}/release/local-ai.exe
          if-no-files-found: error

      - name: Smoke test (unix)
        if: matrix.os != 'windows-latest'
        run: |
          ./cli/target/${{ matrix.target }}/release/local-ai --help
          ./cli/target/${{ matrix.target }}/release/local-ai finetune status || true

      - name: Smoke test (windows)
        if: matrix.os == 'windows-latest'
        run: |
          ./cli/target/${{ matrix.target }}/release/local-ai.exe --help
          ./cli/target/${{ matrix.target }}/release/local-ai.exe finetune status

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Display artifacts
        run: ls -R artifacts
      - uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
